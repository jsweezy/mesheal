name: Release binaries

# Builds and tests Mesheal on Linux, macOS and Windows and packages a download for each:
#   Mesheal-linux-x86_64.AppImage, Mesheal-macos-arm64.zip, Mesheal-windows-x64.zip and the
#   Windows installer Mesheal-windows-x64-setup.exe
# and the Blender extension for each platform (Mesheal-blender-<platform>.zip), tested in Blender.
# Pushing a v<N> tag also publishes them as a GitHub Release (see RELEASE_PROCESS.md).
# Run it by hand (Actions > Release binaries > Run workflow) to test the builds without releasing;
# the packages are then attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to build (comma-separated: linux, macos, windows, blender)"
        default: "linux,macos,windows,blender"
        required: true

permissions:
  contents: read

env:
  # vcpkg version for the Blender module on Linux and macOS (Windows uses the runner's vcpkg)
  VCPKG_COMMIT: 177e8175121536d414f405ed8b3099b325a42638
  # The Blender 5.1+ module (Python 3.13) uses the oneTBB Blender ships. It is built against the TBB
  # of the oldest such Blender (5.1: oneTBB 2022.3, libtbb 12.17); newer Blenders ship newer,
  # backward-compatible TBB. Headers (and Linux/Windows link libraries) from that oneTBB release;
  # on macOS the libraries are taken from Blender itself (oneTBB's macOS package is Intel-only).
  ONETBB_VERSION: 2022.3.0
  BLENDER_FOR_TBB: 5.1.2

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Linux: built on Ubuntu 22.04 so the AppImage also runs on older distributions
  # ----------------------------------------------------------------------------
  linux:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'linux'))
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install build tools and libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential g++-12 cmake ninja-build git ca-certificates wget file \
            libboost-dev libgmp-dev libmpfr-dev libtbb-dev \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # The .docs submodule is private: never check it out here
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 600

      - name: Package AppImage
        env:
          LDAI_OUTPUT: Mesheal-linux-x86_64.AppImage
          OUTPUT: Mesheal-linux-x86_64.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/share/doc/mesheal
          cp LICENSE.md AppDir/usr/share/doc/mesheal/
          for lib in libgmp10 libmpfr6 libtbb12; do
            if [ -f /usr/share/doc/$lib/copyright ]; then cp /usr/share/doc/$lib/copyright AppDir/usr/share/doc/mesheal/$lib-copyright; fi
          done
          install -D -m 644 packaging/linux/mesheal-mime.xml AppDir/usr/share/mime/packages/mesheal.xml
          # The icon's file name must match Icon=mesheal in the desktop entry; at most 512x512
          mkdir -p icon && cp assets/icons/mesheal_512.png icon/mesheal.png
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/src/app/mesheal \
            --desktop-file packaging/linux/mesheal.desktop \
            --icon-file icon/mesheal.png \
            --output appimage
          ls -la Mesheal-linux-x86_64.AppImage

      - name: Smoke test
        run: ./Mesheal-linux-x86_64.AppImage examples/self_intersecting_box.stl --diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-linux-x86_64
          path: Mesheal-linux-x86_64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # macOS (Apple Silicon): Homebrew libraries are copied into Mesheal.app
  # ----------------------------------------------------------------------------
  macos:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'macos'))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # std::stop_token needs Xcode 26's libc++ (Xcode 16 still treats it as experimental).
      # The app still runs on macOS 15: the minimum version is set by CMAKE_OSX_DEPLOYMENT_TARGET.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          clang++ --version | head -1

      - name: Install libraries
        run: brew install ninja cgal boost tbb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build
        run: cmake --build build -j 3

      - name: Test
        run: ctest --test-dir build -j 3 --output-on-failure --timeout 600

      - name: Package app
        run: |
          APP=build/src/app/Mesheal.app
          mkdir -p "$APP/Contents/Resources/licenses"
          cp LICENSE.md "$APP/Contents/Resources/licenses/"
          for f in gmp mpfr tbb; do
            prefix=$(brew --prefix $f)
            for lic in "$prefix"/COPYING* "$prefix"/LICENSE*; do
              if [ -f "$lic" ]; then cp "$lic" "$APP/Contents/Resources/licenses/$f-$(basename "$lic")"; fi
            done
          done
          # Copies the Homebrew libraries into the app, fixes references and re-signs (ad hoc)
          python3 packaging/macos/bundle-libs.py "$APP"
          ditto -c -k --keepParent "$APP" Mesheal-macos-arm64.zip

      - name: Smoke test
        run: |
          mkdir smoke && ditto -x -k Mesheal-macos-arm64.zip smoke
          smoke/Mesheal.app/Contents/MacOS/Mesheal examples/self_intersecting_box.stl --diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-macos-arm64
          path: Mesheal-macos-arm64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Windows (x64, MSVC): libraries from vcpkg, linked statically
  # ----------------------------------------------------------------------------
  windows:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'windows'))
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-release-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-windows-static-md-release.cmake') }}
          # vcpkg only rebuilds what changed, so an older cache still saves most of the work
          restore-keys: vcpkg-x64-windows-static-md-release-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # oneTBB's own Windows release (the version Blender 5.1+ ships): CMake config, import
      # libraries and tbb12.dll / tbbmalloc.dll, which go next to mesheal.exe. The DLL folder goes
      # on PATH so the tests find them.
      - name: Get oneTBB
        shell: pwsh
        run: |
          curl.exe -fsSLo onetbb.zip "https://github.com/uxlfoundation/oneTBB/releases/download/v$env:ONETBB_VERSION/oneapi-tbb-$env:ONETBB_VERSION-win.zip"
          7z x -bd onetbb.zip | Out-Null
          $tbb = "$((Get-Location).Path -replace '\\', '/')/oneapi-tbb-$env:ONETBB_VERSION"
          "ONETBB=$tbb" >> $env:GITHUB_ENV
          "$tbb/redist/intel64/vc14" -replace '/', '\' >> $env:GITHUB_PATH
          Get-ChildItem "$tbb/lib/cmake/tbb"

      # Configure also builds the vcpkg libraries on a cold cache (about an hour); a hang should fail
      # well before the job limit, and the cache below is saved either way
      - name: Configure
        timeout-minutes: 90
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/packaging/vcpkg" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/packaging/vcpkg/triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-md-release `
            -DMESHEAL_USE_TBB=ON -DTBB_DIR="$env:ONETBB/lib/cmake/tbb"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The smoke test below fails unless mesheal.exe --version lists oneTBB
          Select-String "^TBB_" build/CMakeCache.txt

      # Save the built libraries even when a later step fails, so the next run skips rebuilding them
      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-release-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-windows-static-md-release.cmake') }}
        continue-on-error: true

      # -k 0: keep going after a failed file, so one run lists every compile error
      - name: Build
        run: cmake --build build -j 4 -- -k 0

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 600

      - name: Package zip
        shell: pwsh
        run: |
          $out = "Mesheal"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/src/app/mesheal.exe $out/
          Copy-Item LICENSE.md $out/
          Copy-Item packaging/windows/README.txt $out/
          # oneTBB, the parallel library CGAL uses (Precision Isosurface runs on every core)
          Copy-Item "$env:ONETBB/redist/intel64/vc14/tbb12.dll", "$env:ONETBB/redist/intel64/vc14/tbbmalloc.dll" $out/
          # GMP and MPFR (LGPL v3) are linked into mesheal.exe here, so their licenses ship with it
          New-Item -ItemType Directory -Force $out/licenses | Out-Null
          foreach ($lib in "gmp", "mpfr") {
            $copyright = "build/vcpkg_installed/x64-windows-static-md-release/share/$lib/copyright"
            if (-not (Test-Path $copyright)) { throw "missing license file $copyright" }
            Copy-Item $copyright "$out/licenses/$lib-copyright.txt"
          }
          $tbbLicense = Get-ChildItem -Recurse "$env:ONETBB" -Filter "LICENSE*" | Select-Object -First 1
          if (-not $tbbLicense) { throw "missing oneTBB license file" }
          Copy-Item $tbbLicense.FullName "$out/licenses/onetbb-license.txt"
          @(
            "mesheal.exe includes GMP and MPFR, linked statically. Both are licensed under the"
            "GNU LGPL v3; their license texts are in this folder."
            ""
            "tbb12.dll and tbbmalloc.dll are oneTBB $env:ONETBB_VERSION, licensed under the Apache"
            "License 2.0 (onetbb-license.txt)."
            ""
            "Mesheal itself is licensed under the GNU GPL v3 (LICENSE.md). Its complete source code,"
            "with the build recipe, is at https://github.com/jsweezy/mesheal, so you can rebuild"
            "mesheal.exe against your own GMP or MPFR."
          ) | Set-Content "$out/licenses/README.txt"
          # Microsoft C++ runtime, deployed next to the program so no separate install is needed
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $out/
          Compress-Archive -Path $out -DestinationPath Mesheal-windows-x64.zip
          Get-ChildItem $out

      # Run from the unzipped folder with the oneTBB folder taken off PATH, so tbb12.dll must come
      # from the zip
      - name: Smoke test
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'oneapi-tbb' }) -join ';'
          Expand-Archive Mesheal-windows-x64.zip smoke
          $version = ./smoke/Mesheal/mesheal.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if (-not ($version -match 'oneTBB')) { throw "mesheal.exe was built without oneTBB" }
          ./smoke/Mesheal/mesheal.exe examples/self_intersecting_box.stl --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Inno Setup comes with the GitHub Windows runners; install it if an image ever drops it
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String '^CMAKE_PROJECT_VERSION:STATIC=(.+)$' build/CMakeCache.txt).Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path Mesheal).Path)" "/O$((Get-Location).Path)" packaging/windows/mesheal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item Mesheal-windows-x64-setup.exe

      # Silent per-user install as a user would get it, then the uninstaller must remove it all
      - name: Test installer
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'oneapi-tbb' }) -join ';'
          $app = "$env:LOCALAPPDATA\Programs\Mesheal"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Mesheal.lnk"
          $openWith = "HKCU:\Software\Classes\.stl\OpenWithProgids"
          $p = Start-Process -Wait -PassThru ./Mesheal-windows-x64-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=install.log"
          Get-Content install.log -Tail 20
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          foreach ($f in "mesheal.exe", "tbb12.dll", "README.txt", "licenses\README.txt") {
            if (-not (Test-Path "$app\$f")) { throw "not installed: $app\$f" }
          }
          if (-not (Test-Path $shortcut)) { throw "no Start menu entry" }
          if ($null -eq (Get-ItemProperty $openWith -Name "Mesheal.stl" -ErrorAction SilentlyContinue)) { throw ".stl Open with entry missing" }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\Mesheal.stl\shell\open\command").'(default)'
          "Open command: $command"
          & "$app\mesheal.exe" examples/self_intersecting_box.stl --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $p = Start-Process -Wait -PassThru "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          # The uninstaller finishes by deleting itself from a copy that runs on: give it a moment
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\mesheal.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\mesheal.exe") { throw "uninstall left $app\mesheal.exe" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu entry" }
          if (Test-Path "HKCU:\Software\Classes\Mesheal.stl") { throw "uninstall left the .stl registration" }
          if ($null -ne (Get-ItemProperty $openWith -Name "Mesheal.stl" -ErrorAction SilentlyContinue)) { throw "uninstall left the Open with entry" }
          "Install and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-windows-x64
          path: |
            Mesheal-windows-x64.zip
            Mesheal-windows-x64-setup.exe
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Blender extension: the _mesheal module for Python 3.11 (Blender 4.2-5.0, no TBB) and 3.13
  # (5.1+, Blender's own oneTBB), with GMP and MPFR from vcpkg linked in statically, packaged by
  # packaging/blender/build-extension.py
  # ----------------------------------------------------------------------------
  # Built on AlmaLinux 8 (manylinux_2_28, glibc 2.28) so the module loads wherever Blender runs
  blender-linux:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'blender'))
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools and vcpkg
        run: |
          # GMP's build needs autoconf-archive (from EPEL); the image has the rest of autotools
          dnf install -y zip autoconf-archive
          /opt/python/cp313-cp313/bin/python -m pip install -q ninja
          ln -sf /opt/python/cp313-cp313/bin/ninja /usr/local/bin/ninja
          ninja --version && libtoolize --version | head -1
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout -q $VCPKG_COMMIT
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p vcpkg-cache

      - name: Get oneTBB
        run: |
          curl -fsSL "https://github.com/uxlfoundation/oneTBB/releases/download/v$ONETBB_VERSION/oneapi-tbb-$ONETBB_VERSION-lin.tgz" | tar -xz
          echo "ONETBB=$GITHUB_WORKSPACE/oneapi-tbb-$ONETBB_VERSION" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-linux-static-release-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-linux-static-release.cmake') }}
          restore-keys: vcpkg-x64-linux-static-release-

      - name: Configure
        timeout-minutes: 90
        run: |
          for py in 311 313; do
            if [ $py = 313 ]; then
              tbb="-DMESHEAL_USE_TBB=ON -DMESHEAL_BLENDER_TBB_INCLUDE_DIR=$ONETBB/include
                -DMESHEAL_BLENDER_TBB_LIBRARY=$ONETBB/lib/intel64/gcc4.8/libtbb.so.12
                -DMESHEAL_BLENDER_TBBMALLOC_LIBRARY=$ONETBB/lib/intel64/gcc4.8/libtbbmalloc.so.2"
            else
              tbb="-DMESHEAL_USE_TBB=OFF"
            fi
            cmake -S . -B build-py$py -G Ninja -DCMAKE_BUILD_TYPE=Release $tbb \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/packaging/vcpkg" \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/packaging/vcpkg/triplets" \
              -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
              -DVCPKG_TARGET_TRIPLET=x64-linux-static-release \
              -DVCPKG_HOST_TRIPLET=x64-linux-static-release \
              -DMESHEAL_BUILD_GUI=OFF -DMESHEAL_BUILD_PYTHON=ON -DMESHEAL_BUILD_TESTS=OFF \
              -DPython_EXECUTABLE=/opt/python/cp$py-cp$py/bin/python
          done

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-linux-static-release-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-linux-static-release.cmake') }}
        continue-on-error: true

      - name: Build
        run: for py in 311 313; do cmake --build build-py$py -j 4 --target _mesheal; done

      - name: Test the modules in plain Python
        run: |
          for py in 311 313; do
            PY=/opt/python/cp$py-cp$py/bin/python
            $PY -m pip install -q numpy
            # In Blender the module finds Blender's TBB; here, the oneTBB it was built against
            (cd src/python/Test && LD_LIBRARY_PATH="$ONETBB/lib/intel64/gcc4.8" \
              PYTHONPATH="$GITHUB_WORKSPACE/build-py$py/src/python" $PY -m unittest test_mesheal)
          done

      - name: Package
        run: |
          /opt/python/cp313-cp313/bin/python packaging/blender/build-extension.py --platform linux-x64 \
            --licenses vcpkg_installed/x64-linux-static-release/share \
            --out Mesheal-blender-linux-x64.zip build-py*/src/python/_mesheal.*.so

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-blender-linux-x64
          path: Mesheal-blender-linux-x64.zip
          if-no-files-found: error

  blender-macos:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'blender'))
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"

      - name: Install build tools and vcpkg
        run: |
          brew install ninja autoconf autoconf-archive automake libtool
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout -q $VCPKG_COMMIT
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p vcpkg-cache

      - name: Get oneTBB headers and Blender's TBB libraries
        run: |
          curl -fsSL "https://github.com/uxlfoundation/oneTBB/releases/download/v$ONETBB_VERSION/oneapi-tbb-$ONETBB_VERSION-mac.tgz" | tar -xz
          curl -fsSLo blender.dmg "https://download.blender.org/release/Blender${BLENDER_FOR_TBB%.*}/blender-$BLENDER_FOR_TBB-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/Blender blender.dmg > /dev/null
          mkdir blender-tbb
          cp -L /Volumes/Blender/Blender.app/Contents/Resources/lib/libtbb.dylib \
                /Volumes/Blender/Blender.app/Contents/Resources/lib/libtbbmalloc.dylib blender-tbb/
          hdiutil detach /Volumes/Blender > /dev/null
          rm blender.dmg
          otool -L blender-tbb/libtbb.dylib | head -2
          echo "ONETBB=$GITHUB_WORKSPACE/oneapi-tbb-$ONETBB_VERSION" >> "$GITHUB_ENV"
          echo "BLENDER_TBB=$GITHUB_WORKSPACE/blender-tbb" >> "$GITHUB_ENV"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-osx-static-release-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/arm64-osx-static-release.cmake') }}
          restore-keys: vcpkg-arm64-osx-static-release-

      - name: Configure
        timeout-minutes: 90
        run: |
          for py in 311 313; do
            if [ $py = 311 ]; then PY="${{ steps.py311.outputs.python-path }}"; else PY="${{ steps.py313.outputs.python-path }}"; fi
            if [ $py = 313 ]; then
              tbb="-DMESHEAL_USE_TBB=ON -DMESHEAL_BLENDER_TBB_INCLUDE_DIR=$ONETBB/include
                -DMESHEAL_BLENDER_TBB_LIBRARY=$BLENDER_TBB/libtbb.dylib
                -DMESHEAL_BLENDER_TBBMALLOC_LIBRARY=$BLENDER_TBB/libtbbmalloc.dylib"
            else
              tbb="-DMESHEAL_USE_TBB=OFF"
            fi
            cmake -S . -B build-py$py -G Ninja -DCMAKE_BUILD_TYPE=Release $tbb \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.2 -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/packaging/vcpkg" \
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/packaging/vcpkg/triplets" \
              -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
              -DVCPKG_TARGET_TRIPLET=arm64-osx-static-release \
              -DVCPKG_HOST_TRIPLET=arm64-osx-static-release \
              -DMESHEAL_BUILD_GUI=OFF -DMESHEAL_BUILD_PYTHON=ON -DMESHEAL_BUILD_TESTS=OFF \
              -DPython_EXECUTABLE="$PY"
          done

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-osx-static-release-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/arm64-osx-static-release.cmake') }}
        continue-on-error: true

      - name: Build
        run: for py in 311 313; do cmake --build build-py$py -j 3 --target _mesheal; done

      - name: Test the modules in plain Python
        run: |
          for py in 311 313; do
            if [ $py = 311 ]; then PY="${{ steps.py311.outputs.python-path }}"; else PY="${{ steps.py313.outputs.python-path }}"; fi
            "$PY" -m pip install -q numpy
            # In Blender the module finds Blender's TBB; here, the copy taken from Blender
            (cd src/python/Test && DYLD_LIBRARY_PATH="$BLENDER_TBB" \
              PYTHONPATH="$GITHUB_WORKSPACE/build-py$py/src/python" "$PY" -m unittest test_mesheal)
          done

      - name: Package
        run: |
          python3 packaging/blender/build-extension.py --platform macos-arm64 \
            --licenses vcpkg_installed/arm64-osx-static-release/share \
            --out Mesheal-blender-macos-arm64.zip build-py*/src/python/_mesheal.*.so

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-blender-macos-arm64
          path: Mesheal-blender-macos-arm64.zip
          if-no-files-found: error

  blender-windows:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'blender'))
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Same libraries as the Windows app job, so the two share one cache
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-release-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-windows-static-md-release.cmake') }}
          restore-keys: vcpkg-x64-windows-static-md-release-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"

      - name: Get oneTBB
        shell: pwsh
        run: |
          curl.exe -fsSLo onetbb.zip "https://github.com/uxlfoundation/oneTBB/releases/download/v$env:ONETBB_VERSION/oneapi-tbb-$env:ONETBB_VERSION-win.zip"
          7z x -bd onetbb.zip | Out-Null
          "ONETBB=$((Get-Location).Path -replace '\\', '/')/oneapi-tbb-$env:ONETBB_VERSION" >> $env:GITHUB_ENV

      - name: Configure
        timeout-minutes: 90
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $pythons = @{ "311" = "${{ steps.py311.outputs.python-path }}"; "313" = "${{ steps.py313.outputs.python-path }}" }
          # Import libraries for Blender's tbb12.dll and tbbmalloc.dll (same names as oneTBB's)
          $tbb = @{
            "311" = @("-DMESHEAL_USE_TBB=OFF")
            "313" = @("-DMESHEAL_USE_TBB=ON", "-DMESHEAL_BLENDER_TBB_INCLUDE_DIR=$env:ONETBB/include",
                      "-DMESHEAL_BLENDER_TBB_LIBRARY=$env:ONETBB/lib/intel64/vc14/tbb12.lib",
                      "-DMESHEAL_BLENDER_TBBMALLOC_LIBRARY=$env:ONETBB/lib/intel64/vc14/tbbmalloc.lib")
          }
          foreach ($py in "311", "313") {
            $tbbArgs = $tbb[$py]
            cmake -S . -B build-py$py -G Ninja -DCMAKE_BUILD_TYPE=Release @tbbArgs `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/packaging/vcpkg" `
              -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/packaging/vcpkg/triplets" `
              -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release `
              -DVCPKG_HOST_TRIPLET=x64-windows-static-md-release `
              -DMESHEAL_BUILD_GUI=OFF -DMESHEAL_BUILD_PYTHON=ON -DMESHEAL_BUILD_TESTS=OFF `
              -DPython_EXECUTABLE="$($pythons[$py])"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-release-${{ hashFiles('packaging/vcpkg/vcpkg.json', 'packaging/vcpkg/triplets/x64-windows-static-md-release.cmake') }}
        continue-on-error: true

      - name: Build
        shell: pwsh
        run: |
          foreach ($py in "311", "313") {
            cmake --build build-py$py -j 4 --target _mesheal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test the modules in plain Python
        shell: pwsh
        run: |
          $pythons = @{ "311" = "${{ steps.py311.outputs.python-path }}"; "313" = "${{ steps.py313.outputs.python-path }}" }
          # In Blender the module uses Blender's TBB DLLs; here, oneTBB's, next to the module
          Copy-Item "$env:ONETBB/redist/intel64/vc14/tbb12.dll", "$env:ONETBB/redist/intel64/vc14/tbbmalloc.dll" build-py313/src/python/
          foreach ($py in "311", "313") {
            & $pythons[$py] -m pip install -q numpy
            $env:PYTHONPATH = "${{ github.workspace }}/build-py$py/src/python"
            Push-Location src/python/Test
            & $pythons[$py] -m unittest test_mesheal
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }

      - name: Package
        shell: pwsh
        run: |
          $modules = (Get-ChildItem build-py*/src/python/_mesheal.*.pyd).FullName
          python packaging/blender/build-extension.py --platform windows-x64 `
            --licenses vcpkg_installed/x64-windows-static-md-release/share `
            --out Mesheal-blender-windows-x64.zip @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-blender-windows-x64
          path: Mesheal-blender-windows-x64.zip
          if-no-files-found: error

  # Installs each zip into a real Blender (oldest supported 4.2 LTS and the newest; on Linux also
  # 5.0, the last with Python 3.11, and 5.1, the first with 3.13) and runs the smoke test
  blender-test:
    if: ${{ !cancelled() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'blender'))) }}
    needs: [blender-linux, blender-macos, blender-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, blender: 4.2.23 }
          - { os: ubuntu-latest, platform: linux-x64, blender: 5.0.1 }
          - { os: ubuntu-latest, platform: linux-x64, blender: 5.1.2 }
          - { os: ubuntu-latest, platform: linux-x64, blender: 5.2.4 }
          - { os: macos-15, platform: macos-arm64, blender: 4.2.23 }
          - { os: macos-15, platform: macos-arm64, blender: 5.2.4 }
          - { os: windows-latest, platform: windows-x64, blender: 4.2.23 }
          - { os: windows-latest, platform: windows-x64, blender: 5.2.4 }
    name: blender-test (${{ matrix.platform }}, Blender ${{ matrix.blender }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: Mesheal-blender-${{ matrix.platform }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Blender ${{ matrix.blender }}
        shell: bash
        env:
          VERSION: ${{ matrix.blender }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          base="https://download.blender.org/release/Blender${VERSION%.*}/blender-$VERSION"
          case "$PLATFORM" in
            linux-x64)
              sudo apt-get update -qq
              sudo apt-get install -y -qq libx11-6 libxext6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
                libxkbcommon0 libsm6 libice6 libgl1 libegl1 libwayland-client0 libwayland-cursor0 libwayland-egl1
              curl -fsSL "$base-linux-x64.tar.xz" | tar -xJ
              echo "BLENDER=$PWD/blender-$VERSION-linux-x64/blender" >> "$GITHUB_ENV" ;;
            macos-arm64)
              curl -fsSLo blender.dmg "$base-macos-arm64.dmg"
              hdiutil attach -nobrowse -readonly -mountpoint /Volumes/Blender blender.dmg > /dev/null
              echo "BLENDER=/Volumes/Blender/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV" ;;
            windows-x64)
              curl -fsSLo blender.zip "$base-windows-x64.zip"
              7z x -bd blender.zip > /dev/null
              echo "BLENDER=$(cygpath -w "$PWD/blender-$VERSION-windows-x64/blender.exe")" >> "$GITHUB_ENV" ;;
          esac

      - name: Install the extension and run the smoke test
        shell: bash
        run: python packaging/blender/test-extension.py "$BLENDER" dist/Mesheal-blender-${{ matrix.platform }}.zip

  # ----------------------------------------------------------------------------
  # Publish: only for v<N> tags, after every platform built and passed its tests
  # ----------------------------------------------------------------------------
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, blender-linux, blender-macos, blender-windows, blender-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes: this version's section of RELEASES.md
          awk -v tag="$TAG" '$0 ~ "^## "tag" " {on=1; next} /^## / {on=0} on' RELEASES.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          - **Windows (64-bit):** `Mesheal-windows-x64-setup.exe` (installer: Start menu entry, opens .stl files, uninstall from Settings > Apps), or `Mesheal-windows-x64.zip` to run without installing
          - **macOS (Apple Silicon):** `Mesheal-macos-arm64.zip`
          - **Linux (x86-64):** `Mesheal-linux-x86_64.AppImage`
          - **Blender extension (Blender 4.2 or later):** `Mesheal-blender-windows-x64.zip`, `Mesheal-blender-macos-arm64.zip` or `Mesheal-blender-linux-x64.zip`. In Blender: Edit > Preferences > Get Extensions > Install from Disk.

          These builds are not code-signed. See the [install guide](https://jsweezy.github.io/mesheal/install/) for the one-time step to open them.
          EOF
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --title "Mesheal $TAG" --notes-file notes.md

name: Release binaries

# Builds and tests Mesheal on Linux, macOS and Windows and packages a download for each:
#   Mesheal-linux-x86_64.AppImage, Mesheal-macos-arm64.zip, Mesheal-windows-x64.zip
# Pushing a v<N> tag also publishes them as a GitHub Release (see RELEASE_PROCESS.md).
# Run it by hand (Actions > Release binaries > Run workflow) to test the builds without releasing;
# the packages are then attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
    # TEMPORARY while the release builds are brought up: every push to this branch runs them.
    # Put [skip-linux], [skip-macos] or [skip-windows] in the commit message to skip a platform.
    # Remove this branch trigger (and the skip checks below) before merging to main.
    branches: [release-builds]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: linux, macos, windows)"
        default: "linux,macos,windows"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Linux: built on Ubuntu 22.04 so the AppImage also runs on older distributions
  # ----------------------------------------------------------------------------
  linux:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'linux')) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-linux]'))
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install build tools and libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential g++-12 cmake ninja-build git ca-certificates wget file \
            libboost-dev libgmp-dev libmpfr-dev libtbb-dev \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      # The .docs submodule is private: never check it out here
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 600

      - name: Package AppImage
        env:
          LDAI_OUTPUT: Mesheal-linux-x86_64.AppImage
          OUTPUT: Mesheal-linux-x86_64.AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/share/doc/mesheal
          cp LICENSE.md AppDir/usr/share/doc/mesheal/
          for lib in libgmp10 libmpfr6 libtbb12; do
            [ -f /usr/share/doc/$lib/copyright ] && cp /usr/share/doc/$lib/copyright AppDir/usr/share/doc/mesheal/$lib-copyright || true
          done
          install -D -m 644 packaging/linux/mesheal-mime.xml AppDir/usr/share/mime/packages/mesheal.xml
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/src/app/mesheal \
            --desktop-file packaging/linux/mesheal.desktop \
            --icon-file assets/icons/mesheal.png \
            --output appimage
          ls -la Mesheal-linux-x86_64.AppImage

      - name: Smoke test
        run: ./Mesheal-linux-x86_64.AppImage examples/self_intersecting_box.stl --diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-linux-x86_64
          path: Mesheal-linux-x86_64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # macOS (Apple Silicon): Homebrew libraries are copied into Mesheal.app
  # ----------------------------------------------------------------------------
  macos:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'macos')) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-macos]'))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # std::stop_token needs Xcode 26's libc++ (Xcode 16 still treats it as experimental).
      # The app still runs on macOS 15: the minimum version is set by CMAKE_OSX_DEPLOYMENT_TARGET.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          clang++ --version | head -1

      - name: Install libraries
        run: brew install ninja cgal boost tbb dylibbundler

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build
        run: cmake --build build -j 3

      - name: Test
        run: ctest --test-dir build -j 3 --output-on-failure --timeout 600

      - name: Package app
        run: |
          APP=build/src/app/Mesheal.app
          dylibbundler --overwrite-dir --bundle-deps --create-dir \
            --fix-file "$APP/Contents/MacOS/Mesheal" \
            --dest-dir "$APP/Contents/Frameworks" \
            --install-path @executable_path/../Frameworks/
          mkdir -p "$APP/Contents/Resources/licenses"
          cp LICENSE.md "$APP/Contents/Resources/licenses/"
          for f in gmp mpfr tbb; do
            prefix=$(brew --prefix $f)
            for lic in "$prefix"/COPYING* "$prefix"/LICENSE*; do
              [ -f "$lic" ] && cp "$lic" "$APP/Contents/Resources/licenses/$f-$(basename "$lic")"
            done
          done
          # dylibbundler can leave the same LC_RPATH twice, which dyld refuses to load; keep one copy
          # of the bundle's Frameworks path and drop paths into Homebrew or the build folder
          BIN="$APP/Contents/MacOS/Mesheal"
          rpaths() { otool -l "$BIN" | awk '/cmd LC_RPATH/ {getline; getline; print $2}'; }
          rpaths | sort | uniq -c | while read -r count path; do
            keep=1
            case "$path" in @executable_path/*|@loader_path/*) ;; *) keep=0 ;; esac
            remove=$((count - keep))
            for _ in $(seq 1 "$remove"); do install_name_tool -delete_rpath "$path" "$BIN"; done
          done
          echo "Remaining LC_RPATH entries:"; rpaths
          if [ -n "$(rpaths | sort | uniq -d)" ]; then echo "::error::Duplicate LC_RPATH left"; exit 1; fi
          # Modified binaries must be re-signed (ad hoc: no Apple Developer ID)
          codesign --force --deep --sign - "$APP"
          if otool -L "$APP/Contents/MacOS/Mesheal" "$APP"/Contents/Frameworks/*.dylib | grep -E '/opt/homebrew|/usr/local/'; then
            echo "::error::The app still links libraries outside the bundle"; exit 1
          fi
          ditto -c -k --keepParent "$APP" Mesheal-macos-arm64.zip

      - name: Smoke test
        run: |
          mkdir smoke && ditto -x -k Mesheal-macos-arm64.zip smoke
          smoke/Mesheal.app/Contents/MacOS/Mesheal examples/self_intersecting_box.stl --diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-macos-arm64
          path: Mesheal-macos-arm64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Windows (x64, MSVC): libraries from vcpkg, linked statically
  # ----------------------------------------------------------------------------
  windows:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'windows')) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-windows]'))
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('packaging/windows/vcpkg.json') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/packaging/windows" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DMESHEAL_USE_TBB=OFF

      # Save the built libraries even when a later step fails, so the next run skips rebuilding them
      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('packaging/windows/vcpkg.json') }}
        continue-on-error: true

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 600

      - name: Package zip
        shell: pwsh
        run: |
          $out = "Mesheal"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/src/app/mesheal.exe $out/
          Copy-Item LICENSE.md $out/
          # Microsoft C++ runtime, deployed next to the program so no separate install is needed
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $out/
          Compress-Archive -Path $out -DestinationPath Mesheal-windows-x64.zip
          Get-ChildItem $out

      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive Mesheal-windows-x64.zip smoke
          ./smoke/Mesheal/mesheal.exe examples/self_intersecting_box.stl --diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Mesheal-windows-x64
          path: Mesheal-windows-x64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Publish: only for v<N> tags, after every platform built and passed its tests
  # ----------------------------------------------------------------------------
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes: this version's section of RELEASES.md
          awk -v tag="$TAG" '$0 ~ "^## "tag" " {on=1; next} /^## / {on=0} on' RELEASES.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          - **Windows (64-bit):** `Mesheal-windows-x64.zip`
          - **macOS (Apple Silicon):** `Mesheal-macos-arm64.zip`
          - **Linux (x86-64):** `Mesheal-linux-x86_64.AppImage`

          These builds are not code-signed. See the [install guide](https://jsweezy.github.io/mesheal/install/) for the one-time step to open them.
          EOF
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --title "Mesheal $TAG" --notes-file notes.md
